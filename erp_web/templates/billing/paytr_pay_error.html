<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payafin — Ödeme başlatılamadı</title>
  <style>
    body {
      margin: 0; min-height: 100vh; font-family: "Segoe UI", system-ui, sans-serif;
      background: #0b1220; color: #e2e8f0; display: flex; align-items: center; justify-content: center;
    }
    .box {
      max-width: 420px; background: #f8fafc; color: #0f172a; border-radius: 14px;
      padding: 24px; margin: 16px;
    }
    h1 { font-size: 1.2rem; margin: 0 0 10px; }
    p { margin: 0; color: #64748b; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="box">
    <p style="font-weight:700;margin:0 0 8px;color:#0f172a">Payafin</p>
    <h1>Ödeme başlatılamadı</h1>
    <p>{{ mesaj }}</p>
  </div>
</body>
</html>
