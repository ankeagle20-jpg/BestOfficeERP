<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} — Ofisbir</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      line-height: 1.6;
    }
    .legal-wrap {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 16px 8px;
      flex: 1;
    }
    .legal-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 28px 24px;
    }
    h1 { font-size: 1.45rem; margin: 0 0 8px; line-height: 1.3; }
    .legal-kicker { margin: 0 0 18px; color: #64748b; font-size: 0.92rem; }
    .legal-doc h2 { font-size: 1.05rem; margin: 1.15rem 0 0.35rem; }
    .legal-doc p, .legal-doc li { margin: 0 0 0.65rem; }
    .legal-doc a { color: #1d4ed8; }
    .legal-back { display: inline-block; margin-bottom: 14px; color: #1d4ed8; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="legal-wrap">
    <a class="legal-back" href="/">← Ana sayfa</a>
    <article class="legal-card">
      <h1>{{ page_title }}</h1>
      {% if page_kicker %}<p class="legal-kicker">{{ page_kicker }}</p>{% endif %}
      {% include body_template %}
    </article>
  </div>
  {% include "partials/legal_footer.html" %}
</body>
</html>
