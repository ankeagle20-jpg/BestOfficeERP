<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Payafin{% endblock %}</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --ok: #16a34a;
      --err: #dc2626;
      --border: #e2e8f0;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #0f172a 0%, #1e3a5f 45%, #0f172a 100%);
      color: var(--text);
      line-height: 1.5;
    }
    .marketing-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .marketing-card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      padding: 32px 28px;
    }
    .marketing-brand { text-align: center; margin-bottom: 24px; }
    .marketing-brand .logo {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .marketing-brand h1 { margin: 0; font-size: 1.75rem; font-weight: 700; }
    .marketing-brand p { margin: 8px 0 0; color: var(--muted); font-size: 0.95rem; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; color: #334155; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 4px;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .field { margin-bottom: 16px; }
    .field-error {
      color: var(--err);
      font-size: 0.875rem;
      min-height: 1.2em;
      margin-top: 6px;
      display: none;
    }
    .field-error a { color: var(--accent); font-weight: 600; }
    .btn-primary {
      width: 100%;
      padding: 12px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-secondary {
      width: 100%;
      padding: 12px 16px;
      background: #f8fafc;
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }
    .btn-secondary:hover { background: #f1f5f9; }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--muted);
      font-size: 0.875rem;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .section-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 0 0 12px;
      color: #334155;
    }
    @media (max-width: 480px) {
      .marketing-card { padding: 24px 18px; }
      .marketing-brand h1 { font-size: 1.45rem; }
    }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body>
  <div class="marketing-shell">
    <div class="marketing-card">
      {% block content %}{% endblock %}
    </div>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
