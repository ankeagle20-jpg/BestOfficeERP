<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d47a1">
  <title>Payafin Randevu — Çevrimdışı</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #eef4fb;
      color: #1a2332;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .box {
      max-width: 22rem;
      text-align: center;
      background: #fff;
      border: 1px solid #d8dee6;
      border-radius: 14px;
      padding: 1.75rem 1.25rem;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.35rem; color: #0d47a1; }
    p { margin: 0 0 1rem; color: #5c6b7a; line-height: 1.45; font-size: 0.95rem; }
    a {
      display: inline-block;
      background: #0d47a1;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 0.65rem 1.1rem;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Bağlantı yok</h1>
    <p>Payafin Randevu şu an çevrimdışı kullanılamaz. İnternet bağlantınızı kontrol edip tekrar deneyin.</p>
    <a href="/randevu/m/">Yeniden dene</a>
  </div>
</body>
</html>
