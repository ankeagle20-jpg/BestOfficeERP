<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifre Sıfırlama — OFİSBİR ERP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1b2a;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .login-box {
      background: #12243a;
      border: 1px solid #1e3a5f;
      border-radius: 12px;
      padding: 40px 36px;
      width: 400px;
      text-align: center;
    }
    .logo h1 { color: #4fc3f7; font-size: 1.8rem; font-weight: 700; }
    .msg { color: #81d4fa; margin: 24px 0; font-size: .95rem; line-height: 1.5; }
    .back-link { color: #4fc3f7; font-size: .88rem; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo"><h1>🏢 OFİSBİR</h1></div>
    <p class="msg">{{ message }}</p>
    <a class="back-link" href="{{ url_for('forgot_password.forgot_password') }}">Yeni sıfırlama bağlantısı iste</a>
    <br><br>
    <a class="back-link" href="{{ url_for('auth.login') }}">← Giriş sayfasına dön</a>
  </div>
</body>
</html>
