<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yeni Şifre — OFİSBİR ERP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1b2a;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .login-box {
      background: #12243a;
      border: 1px solid #1e3a5f;
      border-radius: 12px;
      padding: 40px 36px;
      width: 400px;
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo h1 { color: #4fc3f7; font-size: 1.8rem; font-weight: 700; letter-spacing: 2px; }
    .logo p { color: #888; font-size: .85rem; margin-top: 4px; }
    label { display: block; color: #888; font-size: .82rem; margin-bottom: 5px; }
    input {
      width: 100%;
      background: #0a1929;
      border: 1px solid #1e3a5f;
      color: #e0f7fa;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: .95rem;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus { border-color: #4fc3f7; }
    button {
      width: 100%;
      background: #4fc3f7;
      color: #000;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover { background: #29b6f6; }
    .alert {
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: .88rem;
    }
    .alert-danger { background: #3a1a1a; color: #ff8a80; border: 1px solid #6a2d2d; }
    .hint { color: #666; font-size: .78rem; margin: -8px 0 14px; line-height: 1.4; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #4fc3f7;
      font-size: .88rem;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <h1>🏢 OFİSBİR</h1>
      <p>Yeni şifre belirle</p>
    </div>

    {% for cat, msg in get_flashed_messages(with_categories=True) %}
    <div class="alert alert-{{ cat }}">{{ msg }}</div>
    {% endfor %}

    <p class="hint">Hesap: <strong style="color:#81d4fa">{{ username }}</strong></p>

    <form method="POST" action="{{ url_for('forgot_password.reset_password', token=token) }}">
      <input type="hidden" name="token" value="{{ token }}">
      <label>Yeni şifre</label>
      <input type="password" name="password" autocomplete="new-password" required minlength="10">

      <label>Yeni şifre (tekrar)</label>
      <input type="password" name="password_confirm" autocomplete="new-password" required minlength="10">

      <p class="hint">En az 10 karakter; büyük harf, küçük harf ve rakam içermelidir.</p>

      <button type="submit">Şifreyi güncelle</button>
    </form>

    <a class="back-link" href="{{ url_for('auth.login') }}">← Giriş sayfasına dön</a>
  </div>
</body>
</html>
