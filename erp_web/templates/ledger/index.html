{% extends "layout.html" %}
{% block title %}Payafin Cari{% endblock %}
{% block extra_head %}
<link rel="manifest" href="/ledger/manifest.webmanifest">
<meta name="theme-color" content="#0d7a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Payafin Cari">
<link rel="apple-touch-icon" href="/static/ledger/icon-192.png">
{% endblock %}
{% block content %}
<style>
  .pc-wrap {
    --pc-ink: #1a2332;
    --pc-muted: #5c6b7a;
    --pc-line: #d8dee6;
    --pc-accent: #0d7a5f;
    --pc-give: #b45309;
    --pc-recv: #0d7a5f;
    --pc-card: #ffffff;
    --pc-on-dark: #e8eef4;
    --pc-on-dark-muted: #a8b8c8;
    max-width: 28rem;
    margin: 0 auto;
    padding: 1.25rem 1rem 3.5rem;
    color: var(--pc-ink);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  /* layout.html koyu body (#0a1929) üstünde düz metinler okunaklı olsun */
  .pc-wrap > h1,
  #pc-detail-name,
  #pc-gdetail-name {
    color: var(--pc-on-dark);
  }
  .pc-wrap > .pc-sub,
  #pc-detail-bal,
  #pc-gdetail-bal {
    color: var(--pc-on-dark-muted);
  }
  .pc-wrap h1 {
    margin: 0 0 0.25rem;
    font-size: 1.55rem;
    font-weight: 650;
    letter-spacing: -0.02em;
  }
  .pc-sub { margin: 0 0 1rem; color: var(--pc-muted); font-size: 0.92rem; }
  .pc-wrap > .pc-sub { color: var(--pc-on-dark-muted); }
  .pc-tabs { display: flex; gap: 0.35rem; margin-bottom: 1rem; }
  .pc-tab {
    flex: 1;
    border: 1px solid var(--pc-line);
    background: #fff;
    border-radius: 10px;
    padding: 0.55rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--pc-muted);
  }
  .pc-tab.active { background: var(--pc-accent); color: #fff; border-color: var(--pc-accent); }
  .pc-toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .pc-toolbar input {
    flex: 1; min-width: 0; border: 1px solid var(--pc-line); border-radius: 10px;
    padding: 0.7rem 0.85rem; font-size: 1rem; background: var(--pc-card);
  }
  .pc-btn {
    border: none; border-radius: 10px; padding: 0.7rem 1rem; font-size: 0.95rem;
    font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .pc-btn-primary { background: var(--pc-accent); color: #fff; }
  .pc-btn-give { background: #fff7ed; color: var(--pc-give); border: 1px solid #fdba74; }
  .pc-btn-recv { background: #ecfdf5; color: var(--pc-recv); border: 1px solid #6ee7b7; }
  .pc-btn-ghost { background: transparent; color: var(--pc-on-dark-muted); border: 1px solid #3d5166; }
  .pc-btn-danger { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .pc-list { display: flex; flex-direction: column; gap: 0.55rem; }
  .pc-item {
    background: var(--pc-card); border: 1px solid var(--pc-line); border-radius: 12px;
    padding: 0.9rem 1rem; cursor: pointer; text-align: left; width: 100%;
    color: var(--pc-ink);
  }
  .pc-item:hover { border-color: #a8b8c8; }
  .pc-item-top { display: flex; justify-content: space-between; gap: 0.75rem; align-items: baseline; }
  .pc-name { font-weight: 600; font-size: 1.02rem; }
  .pc-bal { font-variant-numeric: tabular-nums; font-weight: 650; }
  .pc-bal.pos { color: var(--pc-give); }
  .pc-bal.neg { color: var(--pc-recv); }
  .pc-bal.zero { color: var(--pc-muted); }
  .pc-meta { margin-top: 0.25rem; font-size: 0.8rem; color: var(--pc-muted); }
  .pc-empty {
    text-align: center; padding: 2.5rem 1rem; color: var(--pc-muted);
    border: 1px dashed var(--pc-line); border-radius: 12px; background: var(--pc-card);
  }
  .pc-panel {
    display: none; background: var(--pc-card); border: 1px solid var(--pc-line);
    border-radius: 14px; padding: 1rem; margin-bottom: 1rem;
    color: var(--pc-ink);
  }
  .pc-panel.open { display: block; }
  .pc-panel h2 { margin: 0 0 0.75rem; font-size: 1.1rem; color: var(--pc-ink); }
  .pc-field { margin-bottom: 0.65rem; }
  .pc-field label { display: block; font-size: 0.78rem; color: var(--pc-muted); margin-bottom: 0.2rem; }
  .pc-field input, .pc-field select, .pc-field textarea {
    width: 100%; box-sizing: border-box; border: 1px solid var(--pc-line);
    border-radius: 8px; padding: 0.6rem 0.7rem; font-size: 1rem; background: #fff;
    color: var(--pc-ink);
  }
  .pc-actions { display: flex; flex-wrap: wrap; gap: 0.45rem; margin: 0.75rem 0; }
  #pc-tx-list,
  #pc-g-members {
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
  }
  /* Hareket satırları: .pc-item ile aynı kart yüzeyi (koyu body üzerinde okunaklı) */
  .pc-tx {
    background: var(--pc-card);
    border: 1px solid var(--pc-line);
    border-radius: 12px;
    padding: 0.9rem 1rem;
    font-size: 0.9rem;
    color: var(--pc-ink);
  }
  .pc-tx.voided { opacity: 0.55; text-decoration: line-through; }
  .pc-tx-row { display: flex; justify-content: space-between; gap: 0.5rem; align-items: center; }
  .pc-tx .pc-meta { color: var(--pc-muted); }
  .pc-err { color: #fecaca; font-size: 0.88rem; margin: 0.4rem 0; }
  .pc-panel .pc-err { color: #b91c1c; }
  .pc-back { margin-bottom: 0.75rem; }
  .pc-member {
    display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
    background: var(--pc-card); border: 1px solid var(--pc-line); border-radius: 12px;
    padding: 0.75rem 1rem; font-size: 0.92rem; color: var(--pc-ink);
  }
  .pc-summary {
    margin-bottom: 1rem;
    color: var(--pc-ink);
  }
  .pc-summary-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 0.65rem;
  }
  .pc-summary-head > strong {
    color: var(--pc-on-dark);
    font-size: 1.05rem;
  }
  .pc-summary-head .pc-meta {
    color: var(--pc-on-dark-muted);
  }
  .pc-summary-boxes {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.55rem;
  }
  @media (min-width: 360px) {
    .pc-summary-boxes { grid-template-columns: repeat(3, 1fr); }
  }
  .pc-sum-box {
    background: var(--pc-card);
    border: 1px solid var(--pc-line);
    border-radius: 12px;
    padding: 0.75rem 0.85rem;
    color: var(--pc-ink);
    min-width: 0;
  }
  /* WCAG: beyaz metin — yeşil #166534 ≈7.1:1, kırmızı #991b1b ≈8.3:1 */
  .pc-sum-box-alacak,
  .pc-sum-box-bakiye.pc-sum-bal-pos {
    background: #166534;
    border-color: #14532d;
    color: #ffffff;
  }
  .pc-sum-box-borc,
  .pc-sum-box-bakiye.pc-sum-bal-neg {
    background: #991b1b;
    border-color: #7f1d1d;
    color: #ffffff;
  }
  .pc-sum-box-bakiye.pc-sum-bal-zero {
    background: #475569;
    border-color: #334155;
    color: #ffffff;
  }
  .pc-sum-box-alacak .pc-sum-label,
  .pc-sum-box-borc .pc-sum-label,
  .pc-sum-box-bakiye .pc-sum-label {
    color: rgba(255, 255, 255, 0.9);
  }
  .pc-sum-box-alacak .pc-sum-value,
  .pc-sum-box-borc .pc-sum-value,
  .pc-sum-box-bakiye .pc-sum-value {
    color: #ffffff;
  }
  .pc-sum-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--pc-muted);
    letter-spacing: 0.02em;
    margin-bottom: 0.35rem;
  }
  .pc-sum-value {
    font-size: 0.95rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    word-break: break-word;
    line-height: 1.25;
  }
  .pc-summary-err {
    margin-top: 0.5rem;
    font-size: 0.88rem;
    color: #fecaca;
  }
  .pc-warn {
    margin-top: 0.45rem; font-size: 0.8rem; color: #b45309;
    background: #fff7ed; border-radius: 8px; padding: 0.4rem 0.55rem;
  }
  .pc-fx-select { max-width: 5.5rem; display: inline-block; margin-left: 0.35rem; }
  .pc-stmt-table-wrap {
    margin-top: 0.75rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .pc-stmt-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.78rem;
    background: var(--pc-card);
    color: var(--pc-ink);
    border: 1px solid var(--pc-line);
    border-radius: 10px;
    overflow: hidden;
  }
  .pc-stmt-table th,
  .pc-stmt-table td {
    padding: 0.4rem 0.45rem;
    border-bottom: 1px solid var(--pc-line);
    text-align: left;
    vertical-align: top;
  }
  .pc-stmt-table th {
    background: #eef2f6;
    font-weight: 650;
    color: var(--pc-ink);
    white-space: nowrap;
  }
  .pc-stmt-table td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pc-stmt-table tr.opening { background: #f1f5f9; font-weight: 600; }
  .pc-stmt-table .bal-pos { color: #166534; }
  .pc-stmt-table .bal-neg { color: #991b1b; }
  .pc-stmt-meta {
    margin-top: 0.5rem;
    font-size: 0.8rem;
    color: var(--pc-muted);
  }
</style>

<div class="pc-wrap" id="pc-app">
  <h1>Payafin Cari</h1>
  <p class="pc-sub">Basit borç / alacak takibi</p>

  <div class="pc-summary" id="pc-summary">
    <div class="pc-summary-head">
      <strong>Özet</strong>
      <label class="pc-meta" style="margin:0;">Gösterim
        <select id="pc-fx-cur" class="pc-fx-select">
          <option value="">—</option>
          <option value="TRY" selected>TRY</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
        </select>
      </label>
    </div>
    <div class="pc-summary-boxes" id="pc-summary-boxes">
      <div class="pc-sum-box pc-sum-box-alacak" id="pc-sum-alacak">
        <div class="pc-sum-label">Alacak</div>
        <div class="pc-sum-value" id="pc-sum-alacak-val">—</div>
      </div>
      <div class="pc-sum-box pc-sum-box-borc" id="pc-sum-borc">
        <div class="pc-sum-label">Borç</div>
        <div class="pc-sum-value" id="pc-sum-borc-val">—</div>
      </div>
      <div class="pc-sum-box pc-sum-box-bakiye pc-sum-bal-zero" id="pc-sum-bakiye">
        <div class="pc-sum-label">Bakiye</div>
        <div class="pc-sum-value" id="pc-sum-bakiye-val">—</div>
      </div>
    </div>
    <div id="pc-summary-err" class="pc-summary-err" hidden></div>
    <div id="pc-summary-warn" class="pc-warn" hidden></div>
  </div>

  <div class="pc-tabs" id="pc-home-tabs">
    <button type="button" class="pc-tab active" data-tab="parties">Cariler</button>
    <button type="button" class="pc-tab" data-tab="groups">Gruplar</button>
    <button type="button" class="pc-tab" data-tab="reminders">Hatırlatma</button>
  </div>

  <div id="pc-list-view">
    <div id="pc-parties-home">
      <div class="pc-toolbar">
        <input type="search" id="pc-q" placeholder="Ara…" autocomplete="off">
        <button type="button" class="pc-btn pc-btn-primary" id="pc-btn-new">Yeni Cari</button>
      </div>
      <div class="pc-panel" id="pc-new-panel">
        <h2>Yeni cari</h2>
        <div class="pc-field"><label>Ad</label><input id="pc-new-name" maxlength="200"></div>
        <div class="pc-field">
          <label>Tür</label>
          <select id="pc-new-type"><option value="person">Kişi</option><option value="company">Şirket</option></select>
        </div>
        <div class="pc-field"><label>Telefon</label><input id="pc-new-phone" maxlength="64"></div>
        <div class="pc-field"><label>E-posta</label><input id="pc-new-email" type="email" maxlength="120"></div>
        <div id="pc-new-err" class="pc-err" hidden></div>
        <div class="pc-actions">
          <button type="button" class="pc-btn pc-btn-primary" id="pc-new-save">Kaydet</button>
          <button type="button" class="pc-btn pc-btn-ghost" id="pc-new-cancel">Vazgeç</button>
        </div>
      </div>
      <div id="pc-list" class="pc-list"></div>
    </div>

    <div id="pc-groups-home" hidden>
      <div class="pc-toolbar">
        <input type="search" id="pc-gq" placeholder="Grup ara…" autocomplete="off">
        <button type="button" class="pc-btn pc-btn-primary" id="pc-btn-new-group">Yeni Grup</button>
      </div>
      <div class="pc-panel" id="pc-new-group-panel">
        <h2>Yeni grup</h2>
        <div class="pc-field"><label>Ad</label><input id="pc-ng-name" maxlength="200"></div>
        <div class="pc-field"><label>Not</label><input id="pc-ng-notes" maxlength="300"></div>
        <div id="pc-ng-err" class="pc-err" hidden></div>
        <div class="pc-actions">
          <button type="button" class="pc-btn pc-btn-primary" id="pc-ng-save">Kaydet</button>
          <button type="button" class="pc-btn pc-btn-ghost" id="pc-ng-cancel">Vazgeç</button>
        </div>
      </div>
      <div id="pc-group-list" class="pc-list"></div>
    </div>

    <div id="pc-reminders-home" hidden>
      <div class="pc-toolbar">
        <button type="button" class="pc-btn pc-btn-primary" id="pc-btn-new-rem">Yeni Hatırlatma</button>
      </div>
      <div class="pc-panel" id="pc-new-rem-panel">
        <h2>Hatırlatma</h2>
        <div class="pc-field">
          <label>Cari</label>
          <select id="pc-rem-party"></select>
        </div>
        <div class="pc-field"><label>Vade</label><input type="datetime-local" id="pc-rem-due"></div>
        <div class="pc-field">
          <label>Kanal</label>
          <select id="pc-rem-channel"><option value="in_app">Uygulama</option><option value="email">E-posta</option></select>
        </div>
        <div class="pc-field"><label>Not</label><input id="pc-rem-note" maxlength="300"></div>
        <div id="pc-rem-err" class="pc-err" hidden></div>
        <div class="pc-actions">
          <button type="button" class="pc-btn pc-btn-primary" id="pc-rem-save">Kaydet</button>
          <button type="button" class="pc-btn pc-btn-ghost" id="pc-rem-cancel">Vazgeç</button>
        </div>
      </div>
      <div id="pc-rem-list" class="pc-list"></div>
    </div>
  </div>

  <div id="pc-detail-view" hidden>
    <button type="button" class="pc-btn pc-btn-ghost pc-back" id="pc-back">← Liste</button>
    <h1 id="pc-detail-name">—</h1>
    <p class="pc-sub" id="pc-detail-bal">—</p>
    <div class="pc-actions">
      <button type="button" class="pc-btn pc-btn-give" id="pc-btn-give">Verdim</button>
      <button type="button" class="pc-btn pc-btn-recv" id="pc-btn-recv">Aldım</button>
      <button type="button" class="pc-btn pc-btn-ghost" id="pc-btn-stmt">Ekstre</button>
    </div>

    <div class="pc-panel" id="pc-tx-panel">
      <h2 id="pc-tx-title">Hareket</h2>
      <div class="pc-field"><label>Tutar</label><input id="pc-tx-amount" type="number" min="0.01" step="0.01" inputmode="decimal"></div>
      <div class="pc-field"><label>Para birimi</label><input id="pc-tx-currency" value="TRY" maxlength="3" style="text-transform:uppercase"></div>
      <div class="pc-field"><label>Not</label><input id="pc-tx-note" maxlength="300"></div>
      <div id="pc-tx-err" class="pc-err" hidden></div>
      <div class="pc-actions">
        <button type="button" class="pc-btn pc-btn-primary" id="pc-tx-save">Kaydet</button>
        <button type="button" class="pc-btn pc-btn-ghost" id="pc-tx-cancel">Vazgeç</button>
      </div>
    </div>

    <div class="pc-panel" id="pc-stmt-panel">
      <h2>Ekstre</h2>
      <div class="pc-field"><label>Başlangıç</label><input type="date" id="pc-stmt-from"></div>
      <div class="pc-field"><label>Bitiş</label><input type="date" id="pc-stmt-to"></div>
      <div id="pc-stmt-err" class="pc-err" hidden></div>
      <div class="pc-actions">
        <button type="button" class="pc-btn pc-btn-primary" id="pc-stmt-preview">Önizle</button>
        <button type="button" class="pc-btn pc-btn-ghost" id="pc-stmt-pdf">PDF indir</button>
        <button type="button" class="pc-btn pc-btn-ghost" id="pc-stmt-cancel">Kapat</button>
      </div>
      <div id="pc-stmt-preview-box" class="pc-meta"></div>
    </div>

    <div id="pc-tx-list"></div>
  </div>

  <div id="pc-group-detail-view" hidden>
    <button type="button" class="pc-btn pc-btn-ghost pc-back" id="pc-gback">← Gruplar</button>
    <h1 id="pc-gdetail-name">—</h1>
    <p class="pc-sub" id="pc-gdetail-bal">—</p>
    <div class="pc-panel open">
      <h2>Üye ekle</h2>
      <div class="pc-field">
        <label>Cari</label>
        <select id="pc-g-add-party"></select>
      </div>
      <div class="pc-actions">
        <button type="button" class="pc-btn pc-btn-primary" id="pc-g-add-btn">Ekle</button>
      </div>
    </div>
    <h2 style="font-size:1.05rem;margin:0.5rem 0;">Üyeler</h2>
    <div id="pc-g-members"></div>
  </div>
</div>

<script>
(function () {
  var state = {
    parties: [], groups: [], partyId: null, groupId: null, direction: null, tab: "parties"
  };

  function fmtMoney(n, cur) {
    var v = Number(n || 0);
    try {
      return new Intl.NumberFormat("tr-TR", {
        style: "currency", currency: cur || "TRY", maximumFractionDigits: 2
      }).format(v);
    } catch (e) {
      return v.toFixed(2) + " " + (cur || "");
    }
  }

  function balLabel(primary) {
    if (!primary) return "Bakiye yok";
    var b = Number(primary.balance || 0);
    var cur = primary.currency || "TRY";
    if (Math.abs(b) < 0.005) return "Bakiye: " + fmtMoney(0, cur) + " (denk)";
    if (b > 0) return "Bize borçlu: " + fmtMoney(b, cur);
    return "Biz borçluyuz: " + fmtMoney(Math.abs(b), cur);
  }

  function balClass(primary) {
    if (!primary) return "zero";
    var b = Number(primary.balance || 0);
    if (Math.abs(b) < 0.005) return "zero";
    return b > 0 ? "pos" : "neg";
  }

  function api(path, opts) {
    opts = opts || {};
    return fetch(path, {
      method: opts.method || "GET",
      headers: opts.body ? { "Content-Type": "application/json" } : undefined,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      credentials: "same-origin"
    }).then(function (r) {
      var ct = r.headers.get("content-type") || "";
      if (ct.indexOf("application/json") >= 0 || opts.expectJson !== false) {
        return r.json().then(function (j) {
          if (!r.ok || (j && j.ok === false)) {
            var err = new Error((j && j.mesaj) || ("HTTP " + r.status));
            err.status = r.status;
            throw err;
          }
          return j;
        });
      }
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r;
    });
  }

  function todayISO() {
    var d = new Date();
    return d.toISOString().slice(0, 10);
  }
  function monthStartISO() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-01";
  }

  function setTab(tab) {
    state.tab = tab;
    Array.prototype.forEach.call(document.querySelectorAll(".pc-tab"), function (b) {
      b.classList.toggle("active", b.getAttribute("data-tab") === tab);
    });
    document.getElementById("pc-parties-home").hidden = tab !== "parties";
    document.getElementById("pc-groups-home").hidden = tab !== "groups";
    document.getElementById("pc-reminders-home").hidden = tab !== "reminders";
    if (tab === "groups") loadGroups();
    else if (tab === "reminders") loadReminders();
    else loadList();
  }

  function fmtBalanceBox(n, cur) {
    var v = Number(n || 0);
    if (Math.abs(v) < 0.005) {
      return { text: fmtMoney(0, cur), cls: "pc-sum-bal-zero" };
    }
    if (v > 0) {
      return { text: "+" + fmtMoney(v, cur), cls: "pc-sum-bal-pos" };
    }
    return { text: "−" + fmtMoney(Math.abs(v), cur), cls: "pc-sum-bal-neg" };
  }

  function pickSummarySource(j) {
    var cur = (document.getElementById("pc-fx-cur").value || "").toUpperCase();
    var rows = j.by_currency || [];
    var row = null;
    if (cur) {
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].currency === cur) { row = rows[i]; break; }
      }
    }
    if (!row && rows.length === 1) row = rows[0];
    if (!row && rows.length) {
      for (var j2 = 0; j2 < rows.length; j2++) {
        if (rows[j2].currency === "TRY") { row = rows[j2]; break; }
      }
      if (!row) row = rows[0];
    }
    return row;
  }

  function loadSummary() {
    var cur = document.getElementById("pc-fx-cur").value || "";
    var q = cur ? ("?display_currency=" + encodeURIComponent(cur)) : "";
    return api("/ledger/api/summary" + q).then(function (j) {
      var warn = document.getElementById("pc-summary-warn");
      var errEl = document.getElementById("pc-summary-err");
      errEl.hidden = true;
      errEl.textContent = "";

      var row = pickSummarySource(j);
      var alacakEl = document.getElementById("pc-sum-alacak-val");
      var borcEl = document.getElementById("pc-sum-borc-val");
      var bakiyeEl = document.getElementById("pc-sum-bakiye-val");
      var bakiyeBox = document.getElementById("pc-sum-bakiye");

      if (!row) {
        alacakEl.textContent = "—";
        borcEl.textContent = "—";
        bakiyeEl.textContent = "—";
        bakiyeBox.className = "pc-sum-box pc-sum-box-bakiye pc-sum-bal-zero";
      } else {
        // Alacak = given, Borç = received (API alanları); satırın kendi para birimi
        alacakEl.textContent = fmtMoney(row.given, row.currency);
        borcEl.textContent = fmtMoney(row.received, row.currency);
        var bal = row.balance;
        var balCur = row.currency;
        if (j.converted && j.converted.complete && j.converted.balance != null) {
          bal = j.converted.balance;
          balCur = j.converted.currency;
        }
        var signed = fmtBalanceBox(bal, balCur);
        bakiyeEl.textContent = signed.text;
        bakiyeBox.className = "pc-sum-box pc-sum-box-bakiye " + signed.cls;
      }

      if (j.fx_warnings && j.fx_warnings.length) {
        warn.hidden = false;
        warn.textContent = "Kur uyarısı: " + j.fx_warnings.join(" · ");
      } else if (j.converted && j.converted.complete === false) {
        warn.hidden = false;
        warn.textContent = "Çeviri tamamlanamadı — tek toplam gösterilmedi (yanlış kur yok).";
      } else {
        warn.hidden = true;
        warn.textContent = "";
      }
    }).catch(function (e) {
      var errEl = document.getElementById("pc-summary-err");
      errEl.hidden = false;
      errEl.textContent = e.message || "Özet yüklenemedi";
    });
  }

  function fillRemPartySelect() {
    var sel = document.getElementById("pc-rem-party");
    if (!sel) return;
    sel.innerHTML = "";
    state.parties.forEach(function (p) {
      var o = document.createElement("option");
      o.value = String(p.id);
      o.textContent = p.name;
      sel.appendChild(o);
    });
  }

  function loadReminders() {
    return api("/ledger/api/reminders?filter=upcoming&days=14").then(function (j) {
      var el = document.getElementById("pc-rem-list");
      var rows = j.reminders || [];
      fillRemPartySelect();
      if (!rows.length) {
        el.innerHTML = '<div class="pc-empty">Yakın vadeli hatırlatma yok.</div>';
        return;
      }
      el.innerHTML = rows.map(function () {
        return '<div class="pc-item" style="cursor:default"><div class="pc-item-top"><span class="pc-name"></span><button type="button" class="pc-btn pc-btn-ghost pc-rem-dismiss">Kapat</button></div><div class="pc-meta"></div></div>';
      }).join("");
      Array.prototype.forEach.call(el.querySelectorAll(".pc-item"), function (row, i) {
        var r = rows[i];
        row.querySelector(".pc-name").textContent = (r.party_name || "Cari") + " · " + (r.due_at || "").slice(0, 16).replace("T", " ");
        row.querySelector(".pc-meta").textContent = (r.channel || "") + (r.note ? " — " + r.note : "");
        row.querySelector(".pc-rem-dismiss").addEventListener("click", function () {
          api("/ledger/api/reminders/" + r.id + "/dismiss", { method: "POST", body: {} })
            .then(loadReminders).catch(function (e) { alert(e.message); });
        });
      });
    });
  }

  function renderList() {
    var q = (document.getElementById("pc-q").value || "").trim().toLowerCase();
    var el = document.getElementById("pc-list");
    var rows = state.parties.filter(function (p) {
      return !q || String(p.name || "").toLowerCase().indexOf(q) >= 0;
    });
    if (!rows.length) {
      el.innerHTML = '<div class="pc-empty">Henüz cari yok.<br>Yeni Cari ile başlayın.</div>';
      return;
    }
    el.innerHTML = rows.map(function () {
      return '<button type="button" class="pc-item"><div class="pc-item-top"><span class="pc-name"></span><span class="pc-bal"></span></div><div class="pc-meta"></div></button>';
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".pc-item"), function (btn, i) {
      var p = rows[i];
      var pr = p.primary_balance;
      btn.querySelector(".pc-name").textContent = p.name;
      var balEl = btn.querySelector(".pc-bal");
      balEl.textContent = pr ? fmtMoney(pr.balance, pr.currency) : "—";
      balEl.className = "pc-bal " + balClass(pr);
      btn.querySelector(".pc-meta").textContent =
        ((p.type === "company") ? "Şirket" : "Kişi") + (pr ? " · " + balLabel(pr) : "");
      btn.addEventListener("click", function () { openDetail(p.id); });
    });
  }

  function loadList() {
    return api("/ledger/api/parties").then(function (j) {
      state.parties = j.parties || [];
      renderList();
      fillGroupPartySelect();
      fillRemPartySelect();
    });
  }

  function renderGroups() {
    var q = (document.getElementById("pc-gq").value || "").trim().toLowerCase();
    var el = document.getElementById("pc-group-list");
    var rows = state.groups.filter(function (g) {
      return !q || String(g.name || "").toLowerCase().indexOf(q) >= 0;
    });
    if (!rows.length) {
      el.innerHTML = '<div class="pc-empty">Henüz grup yok.</div>';
      return;
    }
    el.innerHTML = rows.map(function () {
      return '<button type="button" class="pc-item"><div class="pc-item-top"><span class="pc-name"></span><span class="pc-bal"></span></div><div class="pc-meta"></div></button>';
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".pc-item"), function (btn, i) {
      var g = rows[i];
      btn.querySelector(".pc-name").textContent = g.name;
      btn.querySelector(".pc-bal").textContent = (g.member_count || 0) + " üye";
      btn.querySelector(".pc-meta").textContent = g.notes || "Grup";
      btn.addEventListener("click", function () { openGroup(g.id); });
    });
  }

  function loadGroups() {
    return api("/ledger/api/groups").then(function (j) {
      state.groups = j.groups || [];
      renderGroups();
    });
  }

  function fillGroupPartySelect() {
    var sel = document.getElementById("pc-g-add-party");
    if (!sel) return;
    sel.innerHTML = "";
    state.parties.forEach(function (p) {
      var o = document.createElement("option");
      o.value = String(p.id);
      o.textContent = p.name;
      sel.appendChild(o);
    });
  }

  function primaryFromBalances(balances) {
    var bals = balances || [];
    return bals.find(function (b) { return b.currency === "TRY"; }) || bals[0] || null;
  }

  function applyBalancesToUi(balances) {
    var bals = balances || [];
    var primary = primaryFromBalances(bals);
    var el = document.getElementById("pc-detail-bal");
    if (el) el.textContent = balLabel(primary);
    if (!state.partyId) return;
    for (var i = 0; i < state.parties.length; i++) {
      if (state.parties[i].id === state.partyId) {
        state.parties[i].balances = bals;
        state.parties[i].primary_balance = primary;
        break;
      }
    }
  }

  function deferLoadList() {
    setTimeout(function () {
      loadList().catch(function () {});
    }, 0);
  }

  function txRowHtml(t) {
    var dir = t.direction === "give" ? "Verdim" : "Aldım";
    var voided = t.is_void ? " voided" : "";
    var voidBtn = t.is_void
      ? ""
      : ('<button type="button" class="pc-btn pc-btn-danger pc-void" data-id="' + t.id + '">İptal</button>');
    return '<div class="pc-tx' + voided + '" data-tx-id="' + t.id + '"><div class="pc-tx-row"><strong>' +
      dir + " " + fmtMoney(t.amount, t.currency) + "</strong>" + voidBtn +
      '</div><div class="pc-meta"></div></div>';
  }

  function bindVoidButtons(box) {
    if (!box || box._pcVoidBound) return;
    box._pcVoidBound = true;
    box.addEventListener("click", function (ev) {
      var b = ev.target.closest ? ev.target.closest(".pc-void") : null;
      if (!b || !box.contains(b)) return;
      if (!confirm("Bu hareketi iptal et (void)?")) return;
      api("/ledger/api/transactions/" + b.getAttribute("data-id") + "/void", {
        method: "POST", body: { reason: "ui" }
      }).then(function (j) {
        applyBalancesToUi(j.balances || []);
        if (j.transaction) applyTxToDetailList(j.transaction);
        deferLoadList();
      }).catch(function (e) { alert(e.message); });
    });
  }

  function applyTxToDetailList(t) {
    var box = document.getElementById("pc-tx-list");
    if (!box || !t) return;
    var wrap = document.createElement("div");
    wrap.innerHTML = txRowHtml(t);
    var row = wrap.firstChild;
    row.querySelector(".pc-meta").textContent = t.note || "";
    var existing = box.querySelector('[data-tx-id="' + t.id + '"]');
    if (existing) {
      existing.replaceWith(row);
    } else {
      if (box.querySelector(".pc-empty")) box.innerHTML = "";
      box.insertBefore(row, box.firstChild);
    }
    bindVoidButtons(box);
  }

  function openDetail(id) {
    state.partyId = id;
    document.getElementById("pc-home-tabs").hidden = true;
    document.getElementById("pc-list-view").hidden = true;
    document.getElementById("pc-group-detail-view").hidden = true;
    document.getElementById("pc-detail-view").hidden = false;
    document.getElementById("pc-tx-panel").classList.remove("open");
    document.getElementById("pc-stmt-panel").classList.remove("open");
    return api("/ledger/api/parties/" + id).then(function (j) {
      var p = j.party;
      document.getElementById("pc-detail-name").textContent = p.name;
      document.getElementById("pc-detail-bal").textContent = balLabel(p.primary_balance);
      var box = document.getElementById("pc-tx-list");
      var txs = j.transactions || [];
      if (!txs.length) {
        box.innerHTML = '<div class="pc-empty">Henüz hareket yok.</div>';
        return;
      }
      box.innerHTML = txs.map(txRowHtml).join("");
      Array.prototype.forEach.call(box.querySelectorAll(".pc-tx"), function (row, i) {
        row.querySelector(".pc-meta").textContent = txs[i].note || "";
      });
      bindVoidButtons(box);
    });
  }

  function openGroup(id) {
    state.groupId = id;
    document.getElementById("pc-home-tabs").hidden = true;
    document.getElementById("pc-list-view").hidden = true;
    document.getElementById("pc-detail-view").hidden = true;
    document.getElementById("pc-group-detail-view").hidden = false;
    return Promise.all([loadList(), api("/ledger/api/groups/" + id)]).then(function (res) {
      var j = res[1];
      document.getElementById("pc-gdetail-name").textContent = j.group.name;
      document.getElementById("pc-gdetail-bal").textContent =
        "Konsolide: " + balLabel(j.primary_balance);
      fillGroupPartySelect();
      var box = document.getElementById("pc-g-members");
      var members = j.members || [];
      if (!members.length) {
        box.innerHTML = '<div class="pc-empty">Üye yok.</div>';
        return;
      }
      box.innerHTML = members.map(function (m) {
        return '<div class="pc-member"><div><strong class="pc-mn"></strong><div class="pc-meta pc-mb"></div></div><button type="button" class="pc-btn pc-btn-danger pc-g-rm">Çıkar</button></div>';
      }).join("");
      Array.prototype.forEach.call(box.querySelectorAll(".pc-member"), function (row, i) {
        var m = members[i];
        row.querySelector(".pc-mn").textContent = m.name;
        row.querySelector(".pc-mb").textContent = balLabel(m.primary_balance);
        row.querySelector(".pc-g-rm").addEventListener("click", function () {
          api("/ledger/api/groups/" + state.groupId + "/members", {
            method: "POST", body: { party_id: m.id, action: "remove" }
          }).then(function () { return openGroup(state.groupId); })
            .catch(function (e) { alert(e.message); });
        });
      });
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll(".pc-tab"), function (b) {
    b.addEventListener("click", function () { setTab(b.getAttribute("data-tab")); });
  });

  document.getElementById("pc-btn-new").addEventListener("click", function () {
    document.getElementById("pc-new-panel").classList.add("open");
    document.getElementById("pc-new-err").hidden = true;
  });
  document.getElementById("pc-new-cancel").addEventListener("click", function () {
    document.getElementById("pc-new-panel").classList.remove("open");
  });
  document.getElementById("pc-new-save").addEventListener("click", function () {
    var err = document.getElementById("pc-new-err");
    err.hidden = true;
    api("/ledger/api/parties", {
      method: "POST",
      body: {
        name: document.getElementById("pc-new-name").value,
        type: document.getElementById("pc-new-type").value,
        phone: document.getElementById("pc-new-phone").value,
        email: document.getElementById("pc-new-email").value
      }
    }).then(function () {
      document.getElementById("pc-new-panel").classList.remove("open");
      document.getElementById("pc-new-name").value = "";
      document.getElementById("pc-new-phone").value = "";
      document.getElementById("pc-new-email").value = "";
      return loadList();
    }).catch(function (e) { err.textContent = e.message; err.hidden = false; });
  });

  document.getElementById("pc-btn-new-group").addEventListener("click", function () {
    document.getElementById("pc-new-group-panel").classList.add("open");
  });
  document.getElementById("pc-ng-cancel").addEventListener("click", function () {
    document.getElementById("pc-new-group-panel").classList.remove("open");
  });
  document.getElementById("pc-ng-save").addEventListener("click", function () {
    var err = document.getElementById("pc-ng-err");
    err.hidden = true;
    api("/ledger/api/groups", {
      method: "POST",
      body: {
        name: document.getElementById("pc-ng-name").value,
        notes: document.getElementById("pc-ng-notes").value
      }
    }).then(function () {
      document.getElementById("pc-new-group-panel").classList.remove("open");
      document.getElementById("pc-ng-name").value = "";
      document.getElementById("pc-ng-notes").value = "";
      return loadGroups();
    }).catch(function (e) { err.textContent = e.message; err.hidden = false; });
  });

  document.getElementById("pc-btn-new-rem").addEventListener("click", function () {
    fillRemPartySelect();
    document.getElementById("pc-new-rem-panel").classList.add("open");
    document.getElementById("pc-rem-err").hidden = true;
  });
  document.getElementById("pc-rem-cancel").addEventListener("click", function () {
    document.getElementById("pc-new-rem-panel").classList.remove("open");
  });
  document.getElementById("pc-rem-save").addEventListener("click", function () {
    var err = document.getElementById("pc-rem-err");
    err.hidden = true;
    var dueLocal = document.getElementById("pc-rem-due").value;
    var dueIso = dueLocal ? new Date(dueLocal).toISOString() : "";
    api("/ledger/api/reminders", {
      method: "POST",
      body: {
        party_id: Number(document.getElementById("pc-rem-party").value),
        due_at: dueIso,
        channel: document.getElementById("pc-rem-channel").value,
        note: document.getElementById("pc-rem-note").value
      }
    }).then(function () {
      document.getElementById("pc-new-rem-panel").classList.remove("open");
      document.getElementById("pc-rem-note").value = "";
      return loadReminders();
    }).catch(function (e) { err.textContent = e.message; err.hidden = false; });
  });

  document.getElementById("pc-fx-cur").addEventListener("change", loadSummary);

  document.getElementById("pc-q").addEventListener("input", renderList);
  document.getElementById("pc-gq").addEventListener("input", renderGroups);

  document.getElementById("pc-back").addEventListener("click", function () {
    document.getElementById("pc-detail-view").hidden = true;
    document.getElementById("pc-list-view").hidden = false;
    document.getElementById("pc-home-tabs").hidden = false;
    setTab("parties");
  });
  document.getElementById("pc-gback").addEventListener("click", function () {
    document.getElementById("pc-group-detail-view").hidden = true;
    document.getElementById("pc-list-view").hidden = false;
    document.getElementById("pc-home-tabs").hidden = false;
    setTab("groups");
  });

  document.getElementById("pc-g-add-btn").addEventListener("click", function () {
    var pid = document.getElementById("pc-g-add-party").value;
    if (!pid) return;
    api("/ledger/api/groups/" + state.groupId + "/members", {
      method: "POST", body: { party_id: Number(pid), action: "add" }
    }).then(function () { return openGroup(state.groupId); })
      .catch(function (e) { alert(e.message); });
  });

  function openTx(dir) {
    state.direction = dir;
    document.getElementById("pc-tx-title").textContent = dir === "give" ? "Verdim" : "Aldım";
    document.getElementById("pc-stmt-panel").classList.remove("open");
    document.getElementById("pc-tx-panel").classList.add("open");
    document.getElementById("pc-tx-err").hidden = true;
    document.getElementById("pc-tx-amount").value = "";
    document.getElementById("pc-tx-currency").value = "TRY";
    document.getElementById("pc-tx-note").value = "";
  }
  document.getElementById("pc-btn-give").addEventListener("click", function () { openTx("give"); });
  document.getElementById("pc-btn-recv").addEventListener("click", function () { openTx("receive"); });
  document.getElementById("pc-tx-cancel").addEventListener("click", function () {
    document.getElementById("pc-tx-panel").classList.remove("open");
  });
  document.getElementById("pc-tx-save").addEventListener("click", function () {
    var err = document.getElementById("pc-tx-err");
    err.hidden = true;
    api("/ledger/api/transactions", {
      method: "POST",
      body: {
        party_id: state.partyId,
        direction: state.direction,
        amount: document.getElementById("pc-tx-amount").value,
        currency: (document.getElementById("pc-tx-currency").value || "TRY").toUpperCase(),
        note: document.getElementById("pc-tx-note").value
      }
    }).then(function (j) {
      document.getElementById("pc-tx-panel").classList.remove("open");
      applyBalancesToUi(j.balances || []);
      if (j.transaction) applyTxToDetailList(j.transaction);
      deferLoadList();
    }).catch(function (e) { err.textContent = e.message; err.hidden = false; });
  });

  document.getElementById("pc-btn-stmt").addEventListener("click", function () {
    document.getElementById("pc-tx-panel").classList.remove("open");
    document.getElementById("pc-stmt-panel").classList.add("open");
    document.getElementById("pc-stmt-from").value = monthStartISO();
    document.getElementById("pc-stmt-to").value = todayISO();
    document.getElementById("pc-stmt-preview-box").innerHTML = "";
    document.getElementById("pc-stmt-err").hidden = true;
  });
  document.getElementById("pc-stmt-cancel").addEventListener("click", function () {
    document.getElementById("pc-stmt-panel").classList.remove("open");
  });
  document.getElementById("pc-stmt-preview").addEventListener("click", function () {
    var err = document.getElementById("pc-stmt-err");
    err.hidden = true;
    var fr = document.getElementById("pc-stmt-from").value;
    var to = document.getElementById("pc-stmt-to").value;
    var box = document.getElementById("pc-stmt-preview-box");
    box.innerHTML = "<div class='pc-meta'>Yükleniyor…</div>";
    api("/ledger/api/parties/" + state.partyId + "/statement?from=" + encodeURIComponent(fr) + "&to=" + encodeURIComponent(to))
      .then(function (j) {
        var s = j.statement || {};
        var lines = s.lines || [];
        function fmtCell(v, cur) {
          if (v === null || v === undefined) return "";
          return fmtMoney(v, cur || "TRY");
        }
        var html = '<div class="pc-stmt-table-wrap"><table class="pc-stmt-table"><thead><tr>' +
          "<th>Tarih</th><th>Açıklama</th><th>Borç</th><th>Alacak</th><th>Bakiye</th>" +
          "</tr></thead><tbody>";
        if (!lines.length) {
          html += '<tr><td colspan="5">Bu dönemde hareket yok.</td></tr>';
        } else {
          lines.forEach(function (ln) {
            var trClass = ln.row_type === "opening" ? "opening" : "";
            var bal = Number(ln.balance || 0);
            var balCls = Math.abs(bal) < 0.005 ? "" : (bal > 0 ? " bal-pos" : " bal-neg");
            html += '<tr class="' + trClass + '">' +
              "<td>" + (ln.date || "") + "</td>" +
              "<td></td>" +
              '<td class="num">' + (ln.borc != null ? fmtCell(ln.borc, ln.currency) : "") + "</td>" +
              '<td class="num">' + (ln.alacak != null ? fmtCell(ln.alacak, ln.currency) : "") + "</td>" +
              '<td class="num' + balCls + '"></td>' +
              "</tr>";
          });
        }
        html += "</tbody></table></div>";
        html += '<div class="pc-stmt-meta">Hareket: ' + (s.row_count || 0) +
          " · Satır: " + (s.line_count || lines.length) + "</div>";
        box.innerHTML = html;
        var rows = box.querySelectorAll("tbody tr");
        var li = 0;
        Array.prototype.forEach.call(rows, function (tr) {
          if (!lines[li]) return;
          var ln = lines[li++];
          var tds = tr.querySelectorAll("td");
          if (tds.length >= 5) {
            tds[1].textContent = ln.description || "";
            tds[4].textContent = ln.balance_label || "";
          }
        });
      }).catch(function (e) {
        box.innerHTML = "";
        err.textContent = e.message;
        err.hidden = false;
      });
  });
  document.getElementById("pc-stmt-pdf").addEventListener("click", function () {
    var fr = document.getElementById("pc-stmt-from").value;
    var to = document.getElementById("pc-stmt-to").value;
    var url = "/ledger/api/parties/" + state.partyId + "/statement/pdf?from=" +
      encodeURIComponent(fr) + "&to=" + encodeURIComponent(to) + "&indir=1";
    window.open(url, "_blank");
  });

  loadSummary();
  loadList().then(loadSummary).catch(function (e) {
    document.getElementById("pc-list").innerHTML =
      '<div class="pc-empty">' + (e.message || "Yüklenemedi") + "</div>";
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/ledger/sw.js", { scope: "/ledger/" }).catch(function () {
      /* sessiz — PWA opsiyonel */
    });
  }
})();
</script>
{% endblock %}
