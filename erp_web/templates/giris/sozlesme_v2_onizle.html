{% extends "layout.html" %}
{% block page_title %}Sözleşme Önizleme{% endblock %}
{% block content %}
<div style="max-width: 960px; margin: 16px auto; padding: 0 12px;">
  <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px; position:sticky; top:0; background:#0f2740; padding:12px; border-radius:8px; z-index:5;">
    <strong style="color:#e0f7fa; margin-right:auto;">Sözleşme önizleme</strong>
    <a href="{{ indir_url }}" class="btn-word" style="display:inline-flex;align-items:center;gap:8px;background:#2196f3;color:#fff;padding:10px 16px;border-radius:6px;text-decoration:none;font-weight:600;"><i class="fa fa-download"></i> İndir</a>
    <button type="button" onclick="window.close()" style="display:inline-flex;align-items:center;gap:8px;background:#546e7a;color:#fff;padding:10px 16px;border-radius:6px;border:none;cursor:pointer;font-weight:600;">Kapat</button>
  </div>
  <div id="sozlesme-v2-onizle-govde" style="background:#fff; color:#111; padding:24px; border-radius:8px; overflow:auto;">
    {{ preview_html|safe }}
  </div>
</div>
<style>
  #sozlesme-v2-onizle-govde table { border-collapse: collapse; width: 100%; margin: 12px 0; }
  #sozlesme-v2-onizle-govde td, #sozlesme-v2-onizle-govde th { border: 1px solid #ccc; padding: 4px 6px; vertical-align: top; }
  #sozlesme-v2-onizle-govde p { margin: 0.4em 0; }
</style>
{% endblock %}
