<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Senaryo 01</title>
    <style>
        :root {
            --s01-bg: #0f2537;
            --s01-panel: #16324a;
            --s01-border: #2a4a66;
            --s01-text: #e8eef4;
            --s01-muted: #9bb0c3;
            --s01-aktif: #1f8a4c;
            --s01-aktif-border: #176b3a;
            --s01-sticky-bg: #132f45;
            --s01-head-bg: #1a3a55;
            --s01-tutar: #f4fff8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Segoe UI, Tahoma, sans-serif;
            background: var(--s01-bg);
            color: var(--s01-text);
            min-height: 100vh;
        }
        .s01-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem 1rem;
            align-items: flex-end;
            padding: 0.85rem 1rem;
            background: var(--s01-panel);
            border-bottom: 1px solid var(--s01-border);
            position: sticky;
            top: 0;
            z-index: 30;
        }
        .s01-toolbar h1 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 600;
            margin-right: 0.5rem;
            align-self: center;
        }
        .s01-field {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            font-size: 0.78rem;
            color: var(--s01-muted);
        }
        .s01-field select {
            min-width: 6.5rem;
            padding: 0.35rem 0.45rem;
            border: 1px solid var(--s01-border);
            border-radius: 4px;
            background: #0c1f2e;
            color: var(--s01-text);
            font-size: 0.9rem;
        }
        .s01-field select#s01_hizmet_turu {
            min-width: 10rem;
            max-width: 16rem;
        }
        .s01-btn {
            padding: 0.45rem 1rem;
            border: none;
            border-radius: 4px;
            background: #2d7dd2;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }
        .s01-btn:hover { background: #246bb5; }
        .s01-btn:disabled {
            opacity: 0.55;
            cursor: wait;
        }
        .s01-meta {
            margin-left: auto;
            font-size: 0.8rem;
            color: var(--s01-muted);
            align-self: center;
        }
        .s01-status {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            color: var(--s01-muted);
            border-bottom: 1px solid transparent;
        }
        .s01-status.err { color: #ff8f8f; }
        .s01-cache-note {
            display: none;
            padding: 0.45rem 1rem;
            font-size: 0.8rem;
            color: #f0d58a;
            background: #2a2410;
            border-bottom: 1px solid #5a4a1a;
        }
        .s01-cache-note.show { display: block; }
        .s01-wrap {
            overflow: auto;
            max-height: calc(100vh - 120px);
            -webkit-overflow-scrolling: touch;
        }
        .s01-table {
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.72rem;
            table-layout: fixed;
            width: max-content;
            min-width: 100%;
        }
        .s01-table th,
        .s01-table td {
            border-right: 1px solid var(--s01-border);
            border-bottom: 1px solid var(--s01-border);
            padding: 0;
            height: 22px;
            vertical-align: middle;
        }
        .s01-table thead th {
            position: sticky;
            top: 0;
            z-index: 12;
            background: var(--s01-head-bg);
            color: var(--s01-muted);
            font-weight: 600;
            text-align: center;
            height: 52px;
            line-height: 1.15;
            padding: 0.15rem 0.1rem;
        }
        .s01-table th.s01-ay {
            width: 64px;
            min-width: 64px;
            max-width: 64px;
            cursor: pointer;
            user-select: none;
        }
        .s01-table th.s01-ay:hover {
            color: var(--s01-text);
            background: #1e4a68;
        }
        .s01-table th.s01-ay .s01-sort-ok {
            display: block;
            height: 10px;
            font-size: 0.58rem;
            line-height: 10px;
            color: transparent;
        }
        .s01-table th.s01-ay:hover .s01-sort-ok {
            color: #7aa3c4;
        }
        .s01-table th.s01-ay.s01-sort-desc .s01-sort-ok,
        .s01-table th.s01-ay.s01-sort-asc .s01-sort-ok {
            color: #9fd4ff;
        }
        .s01-th-ics {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1px;
            height: 12px;
        }
        .s01-table th.s01-ay .s01-th-ics .s01-sort-ok {
            display: inline;
            height: auto;
            line-height: 12px;
        }
        .s01-filtre-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 12px;
            height: 12px;
            padding: 0;
            border: none;
            background: transparent;
            color: #6a8aa6;
            cursor: pointer;
            line-height: 1;
        }
        .s01-filtre-btn:hover,
        .s01-table th.s01-ay.s01-filtre-on .s01-filtre-btn {
            color: #f0c36a;
        }
        .s01-filtre-btn .s01-huni {
            width: 10px;
            height: 10px;
            pointer-events: none;
        }
        .s01-table th.s01-ay.s01-filtre-on {
            box-shadow: inset 0 -2px 0 #f0c36a;
        }
        .s01-filtre-menu {
            display: none;
            position: fixed;
            z-index: 80;
            min-width: 118px;
            background: #16324a;
            border: 1px solid #2a4a66;
            border-radius: 4px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.45);
            padding: 4px 0;
        }
        .s01-filtre-menu.show { display: block; }
        .s01-filtre-menu button {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            color: var(--s01-text);
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .s01-filtre-menu button:hover { background: #1e4a68; }
        .s01-filtre-menu button.secili { color: #f0c36a; font-weight: 700; }
        .s01-table th.s01-musteri,
        .s01-table td.s01-musteri {
            position: sticky;
            left: 0;
            z-index: 11;
            width: 220px;
            min-width: 220px;
            max-width: 220px;
            background: var(--s01-sticky-bg);
            text-align: left;
            padding: 0 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-right: 2px solid var(--s01-border);
        }
        .s01-table thead th.s01-musteri {
            z-index: 20;
            background: var(--s01-head-bg);
        }
        .s01-table td.s01-hucre {
            width: 64px;
            min-width: 64px;
            max-width: 64px;
            background: transparent;
            text-align: center;
            font-variant-numeric: tabular-nums;
            font-size: 0.62rem;
            line-height: 1.1;
            padding: 0 1px;
            color: transparent;
        }
        .s01-table td.s01-hucre.aktif {
            background: var(--s01-aktif);
            box-shadow: inset 0 0 0 1px var(--s01-aktif-border);
            color: var(--s01-tutar);
            font-weight: 600;
        }
        .s01-table td.s01-hucre.aktif.eksik {
            color: #ffe082;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .s01-id {
            color: var(--s01-muted);
            font-size: 0.68rem;
            margin-right: 0.35rem;
        }
        .s01-table a.s01-musteri-link {
            color: var(--s01-text);
            text-decoration: none;
            cursor: pointer;
        }
        .s01-table a.s01-musteri-link:hover {
            color: #9fd4ff;
            text-decoration: underline;
        }
        .s01-table a.s01-musteri-link .s01-id {
            color: var(--s01-muted);
        }
        .s01-table a.s01-musteri-link:hover .s01-id {
            color: #9fd4ff;
        }
        .s01-empty {
            padding: 2rem 1rem;
            text-align: center;
            color: var(--s01-muted);
        }
        .s01-table tr.s01-ozet td {
            background: #1e4560;
            color: var(--s01-text);
            font-weight: 700;
            text-align: center;
            font-variant-numeric: tabular-nums;
            font-size: 0.62rem;
            line-height: 1.1;
            padding: 0 1px;
            height: 26px;
        }
        .s01-table tr.s01-ozet td.s01-musteri {
            background: #1e4560;
            text-align: left;
            font-size: 0.75rem;
            letter-spacing: 0.01em;
        }
        .s01-table tr.s01-ozet-sayi {
            position: sticky;
            top: 52px;
            z-index: 10;
        }
        .s01-table tr.s01-ozet-sayi td {
            box-shadow: 0 1px 0 var(--s01-border);
        }
        .s01-table tr.s01-ozet-sayi td.s01-musteri {
            z-index: 11;
        }
        .s01-table tr.s01-ozet-sayi td[data-ozet-val="sayi"] {
            cursor: pointer;
            user-select: none;
        }
        .s01-table tr.s01-ozet-sayi td[data-ozet-val="sayi"]:hover {
            background: #2a5a7a;
            color: #fff;
        }
        .s01-table tr.s01-ozet-sayi td[data-ozet-val="sayi"].s01-sort-desc,
        .s01-table tr.s01-ozet-sayi td[data-ozet-val="sayi"].s01-sort-asc {
            background: #246080;
            color: #9fd4ff;
            box-shadow: inset 0 -2px 0 #9fd4ff;
        }
        .s01-table tr.s01-ozet-toplam td {
            background: #0d2a3f;
            border-top: 2px solid #3d6f95;
            color: #d7f5e4;
            height: 28px;
            font-size: 0.64rem;
        }
        .s01-table tr.s01-ozet-toplam td.s01-musteri {
            background: #0d2a3f;
        }
    </style>
</head>
<body>
    <div class="s01-toolbar">
        <h1>Senaryo 01</h1>
        <label class="s01-field">Başlangıç yılı
            <select id="s01_yil_bas" aria-label="Başlangıç yılı"></select>
        </label>
        <label class="s01-field">Bitiş yılı
            <select id="s01_yil_bit" aria-label="Bitiş yılı"></select>
        </label>
        <label class="s01-field">Durum
            <select id="s01_durum" aria-label="Durum filtresi">
                <option value="tumu" selected>Tümü</option>
                <option value="aktif">Aktif</option>
                <option value="pasif">Pasif</option>
            </select>
        </label>
        <label class="s01-field">Hizmet Türü
            <select id="s01_hizmet_turu" aria-label="Hizmet türü filtresi">
                <option value="" selected>Tümü</option>
            </select>
        </label>
        <button type="button" class="s01-btn" id="s01_yukle_btn">Yükle</button>
        <div class="s01-meta" id="s01_meta"></div>
    </div>
    <div class="s01-status" id="s01_status">Yıl seç → yükle</div>
    <div class="s01-cache-note" id="s01_cache_note" aria-live="polite"></div>
    <div class="s01-wrap" id="s01_wrap"></div>
    <div class="s01-filtre-menu" id="s01_filtre_menu" role="menu" hidden>
        <button type="button" data-mod="aktif">Aktif</button>
        <button type="button" data-mod="acilan">Açılan</button>
        <button type="button" data-mod="kapanan">Kapanan</button>
        <button type="button" data-mod="">Temizle</button>
    </div>

<script>
(function () {
    'use strict';

    var AY_KISA = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];

    function s01BugunYil() {
        return (new Date()).getFullYear();
    }

    function s01VarsayilanYillar() {
        var yBit = s01BugunYil();
        return { bas: yBit - 2, bit: yBit };
    }

    function s01YilOptionDoldur(sel, fromY, toY, selected) {
        sel.innerHTML = '';
        var y;
        for (y = fromY; y <= toY; y++) {
            var opt = document.createElement('option');
            opt.value = String(y);
            opt.textContent = String(y);
            if (y === selected) opt.selected = true;
            sel.appendChild(opt);
        }
    }

    function s01InitYilDropdownlari() {
        var now = s01BugunYil();
        var def = s01VarsayilanYillar();
        var elBas = document.getElementById('s01_yil_bas');
        var elBit = document.getElementById('s01_yil_bit');
        s01YilOptionDoldur(elBas, now - 15, now + 2, def.bas);
        s01YilOptionDoldur(elBit, now - 15, now + 2, def.bit);
    }

    /** Backend senaryo01_hucre_aktif ile aynı: kapanış ayı DAHİL, sonraki BOŞ; bit yoksa açık uç. */
    function senaryo01HucreAktif(basIso, bitIso, yil, ay) {
        if (!basIso) return false;
        var bas = new Date(String(basIso).slice(0, 10) + 'T00:00:00');
        if (isNaN(bas.getTime())) return false;
        var basM = new Date(bas.getFullYear(), bas.getMonth(), 1);
        var hedef = new Date(yil, ay - 1, 1);
        if (hedef < basM) return false;
        if (!bitIso) return true;
        var bit = new Date(String(bitIso).slice(0, 10) + 'T00:00:00');
        if (isNaN(bit.getTime())) return true;
        var bitM = new Date(bit.getFullYear(), bit.getMonth(), 1);
        return hedef <= bitM;
    }

    function s01ParseAyKey(key) {
        var p = String(key || '').split('-');
        if (p.length !== 2) return null;
        var y = parseInt(p[0], 10);
        var m = parseInt(p[1], 10);
        if (isNaN(y) || isNaN(m) || m < 1 || m > 12) return null;
        return { y: y, m: m };
    }

    /** Grid ile aynı TR para: 75969.55 → "75.969,55" */
    function s01FormatTutar(n) {
        var x = Number(n);
        if (!isFinite(x)) return '';
        var neg = x < 0;
        x = Math.abs(x);
        var fixed = x.toFixed(2);
        var parts = fixed.split('.');
        var intPart = parts[0];
        var decPart = parts[1] || '00';
        var withDots = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        return (neg ? '-' : '') + withDots + ',' + decPart;
    }

    function s01Esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function s01SetStatus(msg, isErr) {
        var el = document.getElementById('s01_status');
        el.textContent = msg || '';
        el.className = 's01-status' + (isErr ? ' err' : '');
    }

    function s01CacheNotuGoster(meta) {
        var el = document.getElementById('s01_cache_note');
        meta = meta || {};
        var eksik = parseInt(meta.cache_eksik_adet, 10) || 0;
        var rev = parseInt(meta.cache_rev_uyumsuz_adet, 10) || 0;
        var parts = [];
        if (eksik > 0) {
            parts.push(eksik + ' müşteride grid cache eksik (aktif hücrelerde "?" görünebilir)');
        }
        if (rev > 0) {
            parts.push(rev + ' müşteride cache rev uyumsuz (eski hesap; tutar gösterilmez)');
        }
        if (!parts.length) {
            el.className = 's01-cache-note';
            el.textContent = '';
            return;
        }
        el.className = 's01-cache-note show';
        el.textContent = parts.join(' · ');
    }

    var s01LastPayload = null;
    var s01SortAy = null;
    var s01SortMod = 0;
    var s01FiltreAy = null;
    var s01FiltreMod = null;

    var S01_HUNI_SVG = '<svg class="s01-huni" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 2h9L7.2 6.4V10L4.8 11V6.4z" fill="currentColor"/></svg>';

    function s01SortSifirla() {
        s01SortAy = null;
        s01SortMod = 0;
    }

    function s01FiltreSifirla() {
        s01FiltreAy = null;
        s01FiltreMod = null;
        s01FiltreMenuKapat();
    }

    function s01IsoToAyKey(iso) {
        if (!iso) return null;
        var s = String(iso).slice(0, 10);
        var p = s.split('-');
        if (p.length < 2) return null;
        var y = parseInt(p[0], 10);
        var m = parseInt(p[1], 10);
        if (isNaN(y) || isNaN(m) || m < 1 || m > 12) return null;
        return y + '-' + m;
    }

    function s01SatirFiltreEslesir(c, ayKey, mod) {
        if (!c || !mod) return true;
        var p = s01ParseAyKey(ayKey);
        if (!p) return false;
        if (mod === 'aktif') {
            return senaryo01HucreAktif(c.bas || null, c.bit || null, p.y, p.m);
        }
        if (mod === 'acilan') {
            return s01IsoToAyKey(c.bas) === ayKey;
        }
        if (mod === 'kapanan') {
            if (!c.bit) return false;
            return s01IsoToAyKey(c.bit) === ayKey;
        }
        return true;
    }

    function s01FiltrelenmisSatirlar(payload) {
        var satirlar = ((payload && payload.satirlar) || []).slice();
        if (!s01FiltreAy || !s01FiltreMod) return satirlar;
        var out = [];
        var i;
        for (i = 0; i < satirlar.length; i++) {
            if (s01SatirFiltreEslesir(satirlar[i], s01FiltreAy, s01FiltreMod)) {
                out.push(satirlar[i]);
            }
        }
        return out;
    }

    function s01FiltreMenuKapat() {
        var menu = document.getElementById('s01_filtre_menu');
        if (!menu) return;
        menu.className = 's01-filtre-menu';
        menu.hidden = true;
        menu.style.display = 'none';
    }

    function s01FiltreUygula(ayKey, mod) {
        if (!mod) {
            s01FiltreAy = null;
            s01FiltreMod = null;
        } else {
            s01FiltreAy = ayKey;
            s01FiltreMod = mod;
        }
        s01FiltreMenuKapat();
        if (s01LastPayload) s01TabloCiz(s01LastPayload);
    }

    function s01FiltreMenuAc(btn, ayKey) {
        var menu = document.getElementById('s01_filtre_menu');
        if (!menu || !btn || !ayKey) return;
        menu.setAttribute('data-ay', ayKey);
        var buttons = menu.querySelectorAll('button[data-mod]');
        var i, b, m;
        for (i = 0; i < buttons.length; i++) {
            b = buttons[i];
            m = b.getAttribute('data-mod') || '';
            b.className = (s01FiltreAy === ayKey && (s01FiltreMod || '') === m) ? 'secili' : '';
        }
        menu.hidden = false;
        menu.className = 's01-filtre-menu show';
        menu.style.display = 'block';
        var r = btn.getBoundingClientRect();
        var left = r.left;
        var top = r.bottom + 4;
        if (left + 120 > window.innerWidth) left = Math.max(8, window.innerWidth - 128);
        menu.style.left = left + 'px';
        menu.style.top = top + 'px';
    }

    function s01SatirTutar(c, tutarlar, ayKey) {
        if (!c) return null;
        var p = s01ParseAyKey(ayKey);
        if (!p) return null;
        if (!senaryo01HucreAktif(c.bas || null, c.bit || null, p.y, p.m)) return null;
        var ayMap = tutarlar[String(c.id)] || tutarlar[c.id] || {};
        var raw = ayMap[ayKey];
        if (raw != null && raw !== '' && isFinite(Number(raw)) && Number(raw) > 0) {
            return Number(raw);
        }
        return null;
    }

    function s01AdKarsilastir(a, b) {
        var na = String((a && a.ad) || '').toLocaleLowerCase('tr');
        var nb = String((b && b.ad) || '').toLocaleLowerCase('tr');
        if (na < nb) return -1;
        if (na > nb) return 1;
        var ia = parseInt(a && a.id, 10) || 0;
        var ib = parseInt(b && b.id, 10) || 0;
        return ia - ib;
    }

    function s01SiraliSatirlar(payload) {
        var satirlar = s01FiltrelenmisSatirlar(payload);
        if (!s01SortAy || !s01SortMod) return satirlar;
        var tutarlar = (payload && payload.tutarlar) || {};
        var desc = s01SortMod === 1;
        satirlar.sort(function (a, b) {
            var ta = s01SatirTutar(a, tutarlar, s01SortAy);
            var tb = s01SatirTutar(b, tutarlar, s01SortAy);
            var aMiss = (ta == null);
            var bMiss = (tb == null);
            if (aMiss && bMiss) return s01AdKarsilastir(a, b);
            if (aMiss) return 1;
            if (bMiss) return -1;
            if (ta === tb) return s01AdKarsilastir(a, b);
            return desc ? (tb - ta) : (ta - tb);
        });
        return satirlar;
    }

    function s01AyTikla(ayKey) {
        if (!ayKey || !s01LastPayload) return;
        if (s01SortAy === ayKey) {
            s01SortMod += 1;
            if (s01SortMod > 2) {
                s01SortMod = 0;
                s01SortAy = null;
            }
        } else {
            s01SortAy = ayKey;
            s01SortMod = 1;
        }
        s01TabloCiz(s01LastPayload);
    }

    function s01AyBaslikHtml(aylar) {
        var html = '<th class="s01-musteri">Müşteri</th>';
        var i, p, ay, cls, ok, title;
        for (i = 0; i < aylar.length; i++) {
            ay = aylar[i];
            p = s01ParseAyKey(ay);
            cls = 's01-ay';
            ok = '⇅';
            title = 'Bu aya göre sırala (yüksek → düşük)';
            if (s01SortAy === ay && s01SortMod === 1) {
                cls += ' s01-sort-desc';
                ok = '▼';
                title = 'Azalan · tekrar tıkla: artan';
            } else if (s01SortAy === ay && s01SortMod === 2) {
                cls += ' s01-sort-asc';
                ok = '▲';
                title = 'Artan · tekrar tıkla: isim sırası';
            }
            if (s01FiltreAy === ay && s01FiltreMod) cls += ' s01-filtre-on';
            var ics = '<span class="s01-th-ics">' +
                '<span class="s01-sort-ok">' + ok + '</span>' +
                '<span class="s01-filtre-btn" data-ay="' + s01Esc(ay) +
                '" title="Ay filtresi (Aktif / Açılan / Kapanan)">' + S01_HUNI_SVG + '</span>' +
                '</span>';
            if (!p) {
                html += '<th class="' + cls + '" data-ay="' + s01Esc(ay) +
                    '" title="' + s01Esc(title) + '">' + s01Esc(ay) + ics + '</th>';
                continue;
            }
            html += '<th class="' + cls + '" data-ay="' + s01Esc(ay) +
                '" title="' + s01Esc(title) + '">' +
                AY_KISA[p.m - 1] + '<br>' + String(p.y).slice(2) + ics + '</th>';
        }
        return html;
    }

    function s01TabloCiz(payload) {
        var wrap = document.getElementById('s01_wrap');
        s01LastPayload = payload;
        var aylar = payload.aylar || [];
        var satirlar = s01SiraliSatirlar(payload);
        var tutarlar = payload.tutarlar || {};
        if (!(payload.satirlar || []).length) {
            wrap.innerHTML = '<div class="s01-empty">Bu filtre/aralıkta gösterilecek müşteri yok.</div>';
            document.getElementById('s01_meta').textContent = '0 satır · ' + aylar.length + ' ay';
            s01CacheNotuGoster(payload.meta);
            return;
        }

        var thead = '<thead><tr>' + s01AyBaslikHtml(aylar) + '</tr></thead>';
        var bodyParts = [];
        var r, c, ayP, aktif, ad, mid, bas, bit, title, midKey, ayMap, rawTut, cellTxt, cellCls, cellTitle, a;
        var ayAktifSay = [];
        var ayTutarToplam = [];
        for (a = 0; a < aylar.length; a++) {
            ayAktifSay[a] = 0;
            ayTutarToplam[a] = 0;
        }

        for (r = 0; r < satirlar.length; r++) {
            c = satirlar[r];
            mid = c.id;
            midKey = String(mid);
            ad = c.ad || ('#' + mid);
            bas = c.bas || null;
            bit = c.bit || null;
            ayMap = tutarlar[midKey] || tutarlar[mid] || {};
            title = '#' + mid + ' · ' + ad + (bit ? (' · kapanış ' + bit) : '');
            bodyParts.push(
                '<tr data-mid="' + mid + '" data-ht="' + s01Esc(c.hizmet_turu || '') +
                '" data-bas="' + s01Esc(bas || '') + '" data-bit="' + s01Esc(bit || '') + '">'
            );
            bodyParts.push(
                '<td class="s01-musteri" title="' + s01Esc(title) + '">' +
                '<a class="s01-musteri-link" href="/giris/?tab=sozlesmeler&mid=' + mid +
                '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' +
                '<span class="s01-id">#' + mid + '</span>' + s01Esc(ad) +
                '</a></td>'
            );
            for (a = 0; a < aylar.length; a++) {
                ayP = s01ParseAyKey(aylar[a]);
                aktif = ayP ? senaryo01HucreAktif(bas, bit, ayP.y, ayP.m) : false;
                cellTxt = '';
                cellCls = 's01-hucre';
                cellTitle = aylar[a];
                if (aktif) {
                    ayAktifSay[a] += 1;
                    cellCls += ' aktif';
                    rawTut = ayMap[aylar[a]];
                    if (rawTut != null && rawTut !== '' && isFinite(Number(rawTut)) && Number(rawTut) > 0) {
                        ayTutarToplam[a] += Number(rawTut);
                        cellTxt = s01FormatTutar(rawTut);
                        cellTitle = cellTxt + ' ₺ (KDV dahil)';
                    } else {
                        cellTxt = '?';
                        cellCls += ' eksik';
                        cellTitle = 'Tutar yok (cache eksik / rev uyumsuz / placeholder)';
                    }
                }
                bodyParts.push(
                    '<td class="' + cellCls +
                    '" data-ay="' + s01Esc(aylar[a]) + '"' +
                    (aktif ? ' data-aktif="1"' : ' data-aktif="0"') +
                    ' title="' + s01Esc(cellTitle) + '">' +
                    s01Esc(cellTxt) +
                    '</td>'
                );
            }
            bodyParts.push('</tr>');
        }

        var sayParts = [
            '<tr class="s01-ozet s01-ozet-sayi" data-ozet="musteri-sayisi">',
            '<td class="s01-musteri">Müşteri Sayısı</td>'
        ];
        for (a = 0; a < aylar.length; a++) {
            var sayCls = '';
            if (s01SortAy === aylar[a] && s01SortMod === 1) sayCls = ' s01-sort-desc';
            else if (s01SortAy === aylar[a] && s01SortMod === 2) sayCls = ' s01-sort-asc';
            sayParts.push(
                '<td class="' + sayCls.trim() + '" data-ay="' + s01Esc(aylar[a]) +
                '" data-ozet-val="sayi" title="' +
                s01Esc(aylar[a] + ': ' + ayAktifSay[a] + ' aktif müşteri · tıkla: sırala') + '">' +
                s01Esc(s01FormatTutar(ayAktifSay[a])) +
                '</td>'
            );
        }
        sayParts.push('</tr>');

        var topParts = [
            '<tr class="s01-ozet s01-ozet-toplam" data-ozet="toplam">',
            '<td class="s01-musteri">Toplam</td>'
        ];
        for (a = 0; a < aylar.length; a++) {
            topParts.push(
                '<td data-ay="' + s01Esc(aylar[a]) + '" data-ozet-val="toplam" title="' +
                s01Esc(aylar[a] + ': ' + s01FormatTutar(ayTutarToplam[a]) + ' ₺') + '">' +
                s01Esc(s01FormatTutar(ayTutarToplam[a])) +
                '</td>'
            );
        }
        topParts.push('</tr>');

        var parts = ['<table class="s01-table" id="s01_table">', thead, '<tbody>'];
        parts = parts.concat(sayParts).concat(bodyParts).concat(topParts);
        parts.push('</tbody></table>');
        wrap.innerHTML = parts.join('');
        document.getElementById('s01_meta').textContent =
            satirlar.length + ' satır · ' + aylar.length + ' ay';
        s01CacheNotuGoster(payload.meta);
    }

    function s01HizmetTurleriDoldur(opts, keepVal) {
        var sel = document.getElementById('s01_hizmet_turu');
        var cur = (keepVal != null) ? String(keepVal) : (sel.value || '');
        sel.innerHTML = '';
        var o0 = document.createElement('option');
        o0.value = '';
        o0.textContent = 'Tümü';
        sel.appendChild(o0);
        var i, v, o, found = !cur;
        for (i = 0; i < (opts || []).length; i++) {
            v = String(opts[i] || '').trim();
            if (!v) continue;
            o = document.createElement('option');
            o.value = v;
            o.textContent = v;
            if (cur && v === cur) {
                o.selected = true;
                found = true;
            }
            sel.appendChild(o);
        }
        if (cur && !found) {
            o = document.createElement('option');
            o.value = cur;
            o.textContent = cur;
            o.selected = true;
            sel.appendChild(o);
        }
        if (!cur) sel.value = '';
    }

    function s01Yukle() {
        var elBas = document.getElementById('s01_yil_bas');
        var elBit = document.getElementById('s01_yil_bit');
        var elDurum = document.getElementById('s01_durum');
        var elHt = document.getElementById('s01_hizmet_turu');
        var btn = document.getElementById('s01_yukle_btn');
        var yBas = parseInt(elBas.value, 10);
        var yBit = parseInt(elBit.value, 10);
        if (isNaN(yBas) || isNaN(yBit)) {
            s01SetStatus('Geçerli yıl seçin.', true);
            return;
        }
        if (yBit < yBas) {
            var tmp = yBas; yBas = yBit; yBit = tmp;
            elBas.value = String(yBas);
            elBit.value = String(yBit);
        }
        var durum = elDurum.value || 'tumu';
        var hizmet = (elHt && elHt.value) ? elHt.value : '';
        var url = '/giris/api/senaryo-01?yil_bas=' + encodeURIComponent(yBas) +
            '&yil_bit=' + encodeURIComponent(yBit) +
            '&durum=' + encodeURIComponent(durum);
        if (hizmet) {
            url += '&hizmet_turu=' + encodeURIComponent(hizmet);
        }

        btn.disabled = true;
        s01SetStatus('Yükleniyor…');
        fetch(url, { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
            .then(function (res) {
                return res.json().then(function (j) {
                    return { okHttp: res.ok, status: res.status, body: j };
                });
            })
            .then(function (pack) {
                var j = pack.body || {};
                if (!pack.okHttp || !j.ok) {
                    s01SetStatus((j && j.mesaj) ? j.mesaj : ('Hata HTTP ' + pack.status), true);
                    document.getElementById('s01_wrap').innerHTML = '';
                    s01CacheNotuGoster(null);
                    return;
                }
                s01HizmetTurleriDoldur(
                    (j.meta && j.meta.hizmet_turu_options) || [],
                    hizmet
                );
                s01SetStatus(
                    'Yüklendi: ' + j.yil_bas + '–' + j.yil_bit +
                    ' · durum=' + j.durum +
                    (hizmet ? (' · hizmet=' + hizmet) : '') +
                    ' · ' + (j.satirlar || []).length + ' müşteri'
                );
                s01SortSifirla();
                s01FiltreSifirla();
                s01TabloCiz(j);
            })
            .catch(function (err) {
                s01SetStatus('İstek başarısız: ' + String((err && err.message) || err), true);
            })
            .then(function () {
                btn.disabled = false;
            });
    }

    document.addEventListener('DOMContentLoaded', function () {
        s01InitYilDropdownlari();
        document.getElementById('s01_yukle_btn').addEventListener('click', s01Yukle);
        document.getElementById('s01_hizmet_turu').addEventListener('change', s01Yukle);
        document.getElementById('s01_wrap').addEventListener('click', function (ev) {
            var filtreBtn = ev.target.closest ? ev.target.closest('.s01-filtre-btn') : null;
            if (filtreBtn) {
                ev.preventDefault();
                ev.stopPropagation();
                var fay = filtreBtn.getAttribute('data-ay');
                if (fay) s01FiltreMenuAc(filtreBtn, fay);
                return;
            }
            var th = ev.target.closest ? ev.target.closest('th.s01-ay') : null;
            var tdSay = ev.target.closest ? ev.target.closest('td[data-ozet-val="sayi"]') : null;
            var el = th || tdSay;
            if (!el) return;
            var ay = el.getAttribute('data-ay');
            if (ay) s01AyTikla(ay);
        });
        document.getElementById('s01_filtre_menu').addEventListener('click', function (ev) {
            ev.stopPropagation();
            var btn = ev.target.closest ? ev.target.closest('button[data-mod]') : null;
            if (!btn) return;
            var menu = document.getElementById('s01_filtre_menu');
            var ay = menu.getAttribute('data-ay');
            var mod = btn.getAttribute('data-mod') || '';
            s01FiltreUygula(ay, mod);
        });
        document.addEventListener('click', function (ev) {
            if (ev.target.closest && ev.target.closest('#s01_filtre_menu')) return;
            if (ev.target.closest && ev.target.closest('.s01-filtre-btn')) return;
            s01FiltreMenuKapat();
        });
        window.senaryo01HucreAktif = senaryo01HucreAktif;
        window.s01FormatTutar = s01FormatTutar;
        window.s01Yukle = s01Yukle;
    });
})();
</script>
