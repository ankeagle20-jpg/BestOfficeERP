{% extends "layout.html" %}

{% block page_title %}Yeni Ofis{% endblock %}

{% block content %}
<style>
.ofis-header {
    background: #0f2537;
    padding: 12px 16px;
    margin: -10px -10px 10px -10px;
    border-radius: 4px 4px 0 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.ofis-header h2 {
    color: #4fc3f7;
    margin: 0;
    font-size: 16px;
    font-weight: bold;
}
.ofis-form-wrap {
    background: #1e3a50;
    padding: 16px;
    border-radius: 4px;
    max-width: 520px;
}
.ofis-form-row {
    margin-bottom: 14px;
}
.ofis-form-row label {
    display: block;
    color: #b0bec5;
    font-size: 13px;
    margin-bottom: 6px;
}
.ofis-form-row .hint {
    color: #78909c;
    font-size: 11px;
    margin-top: 4px;
}
.ofis-form-row input,
.ofis-form-row select {
    width: 100%;
    box-sizing: border-box;
    background: #2d4060;
    border: 1px solid #3d5070;
    color: #e0f7fa;
    padding: 8px 10px;
    border-radius: 3px;
    font-size: 13px;
}
.ofis-form-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
}
.ofis-form-actions button[type="submit"] {
    background: #00bcd4;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 13px;
}
.ofis-form-actions button[type="submit"]:hover {
    background: #00acc1;
}
.ofis-form-actions .btn-iptal {
    display: inline-block;
    background: transparent;
    color: #b0bec5;
    border: 1px solid #3d5070;
    padding: 7px 14px;
    border-radius: 3px;
    text-decoration: none;
    font-size: 13px;
}
.ofis-form-actions .btn-iptal:hover {
    color: #e0f7fa;
    border-color: #4fc3f7;
}
</style>

<div class="ofis-header">
    <h2>Yeni Ofis</h2>
</div>

<div class="ofis-form-wrap">
    <form method="POST" action="{{ url_for('ofisler.yeni') }}">
        <div class="ofis-form-row">
            <label for="code">Kod *</label>
            <input type="text" id="code" name="code" required
                   placeholder="Örn. HO-201"
                   autocomplete="off">
            <div class="hint">Örn. HO-201 (Hazır), PM-01 (Paylaşımlı), SO-100 (Sanal)</div>
        </div>

        <div class="ofis-form-row">
            <label for="type">Tür *</label>
            <select id="type" name="type" required>
                <option value="">-- Tür seçin --</option>
                <option value="Hazır Ofis">Hazır Ofis</option>
                <option value="Paylaşımlı Masa">Paylaşımlı Masa</option>
                <option value="Sanal Ofis">Sanal Ofis</option>
            </select>
        </div>

        <div class="ofis-form-row">
            <label for="unit_no">Oda / masa no</label>
            <input type="text" id="unit_no" name="unit_no"
                   placeholder="Örn. 201"
                   autocomplete="off">
        </div>

        <div class="ofis-form-row">
            <label for="monthly_price">Aylık kira (₺)</label>
            <input type="number" id="monthly_price" name="monthly_price"
                   step="0.01" min="0" placeholder="0">
        </div>

        <div class="ofis-form-actions">
            <button type="submit">Kaydet</button>
            <a class="btn-iptal" href="{{ url_for('ofisler.index') }}">İptal</a>
        </div>
    </form>
</div>
{% endblock %}
