{% extends "layout.html" %}

{% block page_title %}WhatsApp Sağlık{% endblock %}

{% block content %}
<style>
.ws-wrap { max-width: 980px; margin: 0 auto; }
.ws-head { display:flex; flex-wrap:wrap; align-items:center; gap:10px; justify-content:space-between; margin-bottom:14px; }
.ws-head h2 { margin:0; font-size:18px; }
.ws-btn { background:#00838f; color:#fff; border:none; padding:8px 16px; border-radius:4px; cursor:pointer; font-size:13px; }
.ws-btn:disabled { opacity:.5; cursor:not-allowed; }
.ws-btn.secondary { background:#37474f; }
.ws-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; }
.ws-card { border:1px solid #cfd8dc; border-left:6px solid #90a4ae; border-radius:6px; padding:12px 14px; background:#fff; }
.ws-card.ok { border-left-color:#2e7d32; }
.ws-card.uyari { border-left-color:#f9a825; }
.ws-card.hata { border-left-color:#c62828; }
.ws-card h3 { margin:0 0 6px; font-size:14px; display:flex; align-items:center; gap:8px; }
.ws-dot { width:10px; height:10px; border-radius:50%; background:#90a4ae; display:inline-block; }
.ws-card.ok .ws-dot { background:#2e7d32; }
.ws-card.uyari .ws-dot { background:#f9a825; }
.ws-card.hata .ws-dot { background:#c62828; }
.ws-card p { margin:0; font-size:13px; color:#37474f; line-height:1.5; }
.ws-ipucu { margin:8px 0 0; font-size:12px; color:#546e7a; line-height:1.4; }
.ws-msg { margin-top:14px; font-size:13px; padding:10px 12px; border-radius:4px; display:none; }
.ws-msg.ok { display:block; background:#e8f5e9; border:1px solid #a5d6a7; }
.ws-msg.err { display:block; background:#ffebee; border:1px solid #ef9a9a; }
.ws-zaman { font-size:12px; color:#78909c; margin-top:10px; }
</style>

<div class="ws-wrap">
  <div class="ws-head">
    <h2>WhatsApp Sağlık</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button type="button" class="ws-btn" id="btnYenile">Yenile</button>
      <button type="button" class="ws-btn secondary" id="btnUyandir">Servisi uyandır</button>
      <button type="button" class="ws-btn secondary" id="btnTazele">Bekleyenleri tazele</button>
      <button type="button" class="ws-btn" style="background:#c62828;" id="btnEskiKapat" disabled>Eski bekleyenleri kapat</button>
      <button type="button" class="ws-btn" style="background:#6a1b9a;" id="btnKurtar">Oturumu kurtar (Chrome'u yeniden başlat)</button>
      <a class="ws-btn secondary" style="text-decoration:none;display:none;" id="btnQr" href="/whatsapp/qr-ac" target="_blank" rel="noopener">QR göster</a>
    </div>
  </div>

  <div class="ws-grid" id="wsKartlar">
    <div class="ws-card"><h3><span class="ws-dot"></span>Yükleniyor</h3><p>Kontrol ediliyor…</p></div>
  </div>
  <div class="ws-msg" id="wsMsg"></div>
  <div id="wsBelirsizKutu" style="display:none;margin-top:16px;">
    <h3 style="font-size:14px;margin:0 0 8px;">Sonucu belirsiz kayıtlar — elle işaretleme</h3>
    <div id="wsBelirsiz"></div>
  </div>
  <div class="ws-zaman" id="wsZaman"></div>
</div>

<script>
(function () {
  const kartlarEl = document.getElementById("wsKartlar");
  const msgEl = document.getElementById("wsMsg");
  const zamanEl = document.getElementById("wsZaman");
  const btnQr = document.getElementById("btnQr");
  const btnEskiKapat = document.getElementById("btnEskiKapat");
  var sonSayaclar = null;

  function mesaj(metin, ok) {
    msgEl.textContent = metin || "";
    msgEl.className = "ws-msg " + (ok ? "ok" : "err");
    msgEl.style.display = metin ? "block" : "none";
  }

  async function ozetYukle() {
    kartlarEl.innerHTML = '<div class="ws-card"><h3><span class="ws-dot"></span>Yükleniyor</h3><p>Kontrol ediliyor…</p></div>';
    try {
      const r = await fetch("/whatsapp/api/saglik-ozet", { credentials: "same-origin" });
      const j = await r.json();
      if (!j || !j.ok || !Array.isArray(j.kontroller)) {
        kartlarEl.innerHTML = '<div class="ws-card hata"><h3><span class="ws-dot"></span>Sağlık özeti</h3><p>Özet alınamadı. Sayfayı yenileyin.</p></div>';
        return;
      }
      kartlarEl.innerHTML = j.kontroller.map(function (k) {
        const sev = ["ok", "uyari", "hata"].indexOf(k.seviye) >= 0 ? k.seviye : "";
        const ipucu = k.ipucu
          ? '<p class="ws-ipucu" title="' + escapeHtml(k.ipucu) + '">' + escapeHtml(k.ipucu) + "</p>"
          : "";
        return '<div class="ws-card ' + sev + '"><h3><span class="ws-dot"></span>' +
          escapeHtml(k.baslik || "") + "</h3><p>" + escapeHtml(k.aciklama || "") + "</p>" +
          ipucu + "</div>";
      }).join("");
      sonSayaclar = j.sayaclar || null;
      btnEskiKapat.disabled = !((sonSayaclar && sonSayaclar.kapatilabilir) > 0);
      belirsizYukle();
      const oturumKart = j.kontroller.find(function (k) { return k.anahtar === "oturum"; });
      btnQr.style.display = (oturumKart && oturumKart.seviye !== "ok") ? "" : "none";
      zamanEl.textContent = "Son yenileme: " + new Date().toLocaleTimeString("tr-TR");
    } catch (e) {
      kartlarEl.innerHTML = '<div class="ws-card hata"><h3><span class="ws-dot"></span>Sağlık özeti</h3><p>Özet alınamadı (bağlantı sorunu).</p></div>';
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  async function post(btn, url) {
    btn.disabled = true;
    try {
      const r = await fetch(url, { method: "POST", credentials: "same-origin" });
      const j = await r.json().catch(function () { return {}; });
      mesaj(j.mesaj || (j.ok ? "İşlem tamam." : "İşlem başarısız."), !!j.ok);
    } catch (e) {
      mesaj("İstek gönderilemedi (bağlantı sorunu).", false);
    } finally {
      btn.disabled = false;
      ozetYukle();
    }
  }

  const AKIS = { sozlesme: "Sözleşme", not: "Not", odeme: "Ödeme linki" };
  async function belirsizYukle() {
    const kutu = document.getElementById("wsBelirsizKutu");
    const el = document.getElementById("wsBelirsiz");
    try {
      const r = await fetch("/whatsapp/api/saglik-belirsiz", { credentials: "same-origin" });
      const j = await r.json();
      const liste = (j && j.kayitlar) || [];
      if (!liste.length) { kutu.style.display = "none"; el.innerHTML = ""; return; }
      kutu.style.display = "";
      el.innerHTML = liste.map(function (k) {
        return '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid #eceff1;border-radius:4px;padding:6px 8px;margin-bottom:6px;">' +
          "<span><b>" + escapeHtml(AKIS[k.kaynak] || k.kaynak) + "</b> #" + escapeHtml(k.id) + " · " + escapeHtml(k.zaman || "") + "</span>" +
          '<span style="margin-left:auto;display:flex;gap:6px;">' +
          '<button type="button" class="ws-btn" data-isaret="gonderildi" data-kaynak="' + escapeHtml(k.kaynak) + '" data-id="' + escapeHtml(k.id) + '">Gönderildi</button>' +
          '<button type="button" class="ws-btn secondary" data-isaret="gonderilmedi" data-kaynak="' + escapeHtml(k.kaynak) + '" data-id="' + escapeHtml(k.id) + '">Gönderilmedi</button>' +
          "</span></div>";
      }).join("");
      el.querySelectorAll("[data-isaret]").forEach(function (btn) {
        btn.addEventListener("click", function () { isaretle(btn); });
      });
    } catch (e) { kutu.style.display = "none"; }
  }

  async function isaretle(btn) {
    const kaynak = btn.getAttribute("data-kaynak");
    const id = btn.getAttribute("data-id");
    const sonuc = btn.getAttribute("data-isaret");
    const yazi = sonuc === "gonderildi" ? "Gönderildi" : "Gönderilmedi";
    let metin = (AKIS[kaynak] || kaynak) + " #" + id + " kaydı \"" + yazi + "\" olarak işaretlenecek. WhatsApp'ta kontrol ettiğinizden emin olun.";
    if (sonuc === "gonderilmedi" && (kaynak === "not" || kaynak === "odeme")) {
      metin += " Bu kayıt otomatik tekrar gönderilmeyecek.";
    }
    metin += " Devam edilsin mi?";
    if (!window.confirm(metin)) return;
    btn.disabled = true;
    try {
      const r = await fetch("/whatsapp/api/saglik-belirsiz-isaret", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kaynak: kaynak, id: Number(id), sonuc: sonuc })
      });
      const j = await r.json().catch(function () { return {}; });
      mesaj(j.mesaj || (j.ok ? "Kayıt işaretlendi." : "Kayıt işaretlenemedi (" + (j.hata || r.status) + ")."), !!j.ok);
    } catch (e) {
      mesaj("İstek gönderilemedi (bağlantı sorunu).", false);
    } finally {
      btn.disabled = false;
      ozetYukle();
    }
  }

  document.getElementById("btnYenile").addEventListener("click", ozetYukle);
  document.getElementById("btnUyandir").addEventListener("click", function () { post(this, "/whatsapp/api/saglik-uyandir"); });
  document.getElementById("btnTazele").addEventListener("click", function () { post(this, "/whatsapp/api/saglik-tazele"); });
  document.getElementById("btnKurtar").addEventListener("click", function () {
    if (!window.confirm("Servisin WhatsApp penceresi kapatılıp yeniden açılacak, 1-2 dk sürer. Devam edilsin mi?")) return;
    post(this, "/whatsapp/api/saglik-oturum-kurtar");
  });
  btnEskiKapat.addEventListener("click", function () {
    const n = (sonSayaclar && sonSayaclar.kapatilabilir) || 0;
    if (n <= 0) { mesaj("Kapatılacak eski kayıt yok.", false); return; }
    if (!window.confirm(n + " eski bekleyen kayıt kapatılacak ve WhatsApp'a gönderilmeyecek. Devam edilsin mi?")) return;
    post(this, "/whatsapp/api/saglik-eski-kapat");
  });
  ozetYukle();
})();
</script>
{% endblock %}
