<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Payafin{% endblock %}</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --ok: #16a34a;
      --err: #dc2626;
      --border: #e2e8f0;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #0f172a 0%, #1e3a5f 45%, #0f172a 100%);
      color: var(--text);
      line-height: 1.5;
    }
    .signup-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .signup-card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      padding: 32px 28px;
    }
    .signup-brand { text-align: center; margin-bottom: 24px; }
    .signup-brand .logo {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .signup-brand h1 { margin: 0; font-size: 1.75rem; font-weight: 700; }
    .signup-brand p { margin: 8px 0 0; color: var(--muted); font-size: 0.95rem; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; color: #334155; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 4px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .field { margin-bottom: 16px; }
    .field-error { color: var(--err); font-size: 0.8rem; min-height: 1.2em; margin-top: 2px; }
    .hp-field { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .slug-preview { font-size: 0.9rem; color: var(--muted); margin-top: 4px; }
    .slug-preview strong { color: var(--accent); }
    .slug-status { font-size: 0.8rem; margin-top: 4px; min-height: 1.2em; }
    .slug-status.ok { color: var(--ok); }
    .slug-status.bad { color: var(--err); }
    .pricing-box {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.9rem;
      color: #0c4a6e;
      margin-bottom: 16px;
    }
    .btn-primary {
      width: 100%;
      padding: 12px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .panel { display: none; }
    .panel.active { display: block; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .center-text { text-align: center; }
    .success-icon, .fail-icon {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.75rem; margin: 0 auto 16px;
    }
    .success-icon { background: #dcfce7; color: var(--ok); }
    .fail-icon { background: #fee2e2; color: var(--err); }
    .global-error {
      background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
      padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem;
    }
    @media (max-width: 480px) {
      .signup-card { padding: 24px 18px; }
      .signup-brand h1 { font-size: 1.45rem; }
    }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body>
  <div class="signup-shell">
    <div class="signup-card">
      {% block content %}{% endblock %}
    </div>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
