<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-posta — Facebook ile giriş</title>
  <style>
    body { font-family: Segoe UI, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; }
    main { max-width: 420px; margin: 12vh auto; padding: 24px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
    button { margin-top: 12px; width: 100%; background: #1877F2; color: #fff; border: 0; border-radius: 8px; padding: 11px; font-weight: 700; cursor: pointer; }
    .err { color: #b91c1c; font-size: 0.88rem; }
    p { color: #475569; }
  </style>
</head>
<body>
  <main>
    <h1 style="font-size:1.15rem;margin:0 0 8px;">E-posta gerekli</h1>
    <p>Facebook e-posta adresinizi paylaşmadı. Devam etmek için girişte kullanacağınız e-postayı yazın.</p>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <form method="post" action="/auth/facebook/email">
      <input type="hidden" name="ticket" value="{{ ticket }}">
      <label for="email">E-posta</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <button type="submit">Devam et</button>
    </form>
  </main>
</body>
</html>
