# Render Blueprint — Bulut linki: https://bestofficeerp.onrender.com
# Bu PC açık kalmasa da çalışır; link her yerden açılır.
services:
  - type: web
    name: bestofficeerp
    runtime: python
    plan: free
    rootDir: erp_web
    # Ücretsiz planda ~512MB RAM: tek process (-w 1); gthread + threads=2
    # (sync'te istek-ici blocking heartbeat kiriyordu -> WORKER TIMEOUT).
    healthCheckPath: /healthz
    # Selenium/ChromeDriver build'de timeout yapıyor; Render için hafif liste kullan
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn -w 1 --threads 2 --worker-class gthread -b 0.0.0.0:$PORT --timeout 120 --graceful-timeout 30 app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: TENANT_APEX_DOMAINS
        value: "payafin.com,bestofficeerp.com,bestofficeerp.local"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        sync: false
